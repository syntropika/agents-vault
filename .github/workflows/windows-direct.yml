name: Windows direct CLI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-direct-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-cli:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust toolchain
        id: rust
        shell: pwsh
        run: |
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-direct-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-direct-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
      - name: Build and test direct-mode crates
        shell: pwsh
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -p av-core -p av --all-targets
      - name: Save Rust build cache
        if: always() && steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Build the offline CLI
        shell: powershell
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p av
      - name: Verify offline package lifecycle in Windows PowerShell 5.1
        shell: powershell
        run: |
          .\packaging\windows\test-package.ps1 -Binary .\target\x86_64-pc-windows-msvc\release\av.exe
      - name: Parse native interactive secret journey
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\packaging\windows\test-direct-console.ps1).Path, [ref] $tokens, [ref] $errors) | Out-Null
          if ($errors.Count -ne 0) { throw $errors[0].Message }
          Write-Host 'Interactive console journey parsed. Human-run native console gate remains open.'
      - name: Prepare unsigned review artifact
        shell: powershell
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object { $_.name -eq 'av' }).version
          .\packaging\windows\make-package.ps1 -Binary .\target\x86_64-pc-windows-msvc\release\av.exe -Version $version -OutputDirectory "$env:RUNNER_TEMP\agents-vault-packages"
      - uses: actions/upload-artifact@v4
        with:
          name: agents-vault-windows-x64-unsigned
          path: ${{ runner.temp }}/agents-vault-packages/agents-vault-*
          if-no-files-found: error
