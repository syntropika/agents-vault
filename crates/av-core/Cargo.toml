[package]
name = "av-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Project configuration, credential policy, and encrypted storage for Agents Vault"
readme.workspace = true
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
anyhow = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hex = "0.4"
fs2 = "0.4"
rusqlite = { version = "0.40", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
