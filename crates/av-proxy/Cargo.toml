[package]
name = "av-proxy"
version = "0.1.0"
edition = "2024"
description = "Bounded HTTPS credential injection proxy for Agents Vault"
license = "Apache-2.0"
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
base64 = "0.22"
futures-core = "0.3"
hyper = { version = "0.14", features = ["client", "http1", "server", "stream", "tcp"] }
rustls = "0.23"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-rustls = "0.26"

[dev-dependencies]
rcgen = "0.14"
