[package]
name = "av-fixture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rustls = "0.23"
rustls-pemfile = "2"

[dev-dependencies]
av-core = { path = "../av-core" }
avd = { path = "../avd" }
hyper = { version = "0.14", features = ["http1", "server"] }
rcgen = "0.14"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "sync", "time"] }
tokio-rustls = "0.26"
uuid = { version = "1", features = ["serde"] }
