[package]
name = "avd"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Credential broker, local operator console, and approval services for Agents Vault"
readme.workspace = true
include = ["src/**", "tests/**", "examples/**", "build.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "assets/**"]

[dependencies]
anyhow = "1"
av-core = { version = "0.1.0", path = "../av-core" }
av-proxy = { version = "0.1.0", path = "../av-proxy" }
hex = "0.4"
hyper = { version = "0.14", features = ["http1", "server", "tcp"] }
libc = "0.2"
rand = "0.9"
rcgen = "0.14"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "sync", "signal", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
hyper = { version = "0.14", features = ["client", "tcp", "http1"] }
tokio-rustls = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
av-runner = { version = "0.1.0", path = "../av-runner" }

[target.'cfg(target_os = "macos")'.dependencies]
av-vmm = { version = "0.1.0", path = "../av-vmm" }
