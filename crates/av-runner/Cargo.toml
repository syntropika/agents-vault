[package]
name = "av-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Experimental Linux network-isolated CLI runner primitive"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
libc = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "av-runner-helper"
path = "src/bin/av-runner-helper.rs"

[[bin]]
name = "av-runner-canary"
path = "src/bin/av-runner-canary.rs"
