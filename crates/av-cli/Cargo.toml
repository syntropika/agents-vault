[package]
name = "agents-vault"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Local project configuration, encrypted credentials, and reviewed CLI actions"
readme.workspace = true
keywords = ["secrets", "credentials", "cli", "agents", "environment"]
categories = ["command-line-utilities", "config"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[[bin]]
name = "av"
path = "src/main.rs"

[dependencies]
anyhow = "1"
av-core = { version = "0.1.0", path = "../av-core" }
av-proxy = { version = "0.1.0", path = "../av-proxy" }
clap = { version = "4", features = ["derive"] }
directories = "6"
hyper = { version = "0.14", features = ["client", "http1", "server"] }
rcgen = "0.14"
rpassword = "7"
rustls = "0.23"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
avd = { version = "0.1.0", path = "../avd" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
base64 = "0.22"
rcgen = "0.14"
rustls-pemfile = "2"
tokio-rustls = "0.26"
